      (() => {
        const root = document.documentElement;
        const group = document.querySelector('.appearance-switch');
        const buttons = group.querySelectorAll('button');
        function apply(appearance) {
          if (appearance === 'classic') root.dataset.appearance = 'classic';
          else delete root.dataset.appearance;
          for (const button of buttons) {
            button.setAttribute('aria-pressed', String(button.dataset.appearanceOption === appearance));
          }
        }
        apply(root.dataset.appearance ?? 'modern');
        group.addEventListener('click', event => {
          const appearance = event.target.closest('button')?.dataset.appearanceOption;
          if (!appearance) return;
          apply(appearance);
          try {
            localStorage.setItem('tin-hoc-web:appearance', appearance);
          } catch {
            // Keep the selection on this page.
          }
        });
        group.hidden = false;
      })();
    </script></body></html>
