<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Không tìm thấy trang</title><meta name="description" content="Đường dẫn này chưa có nội dung."><link rel="canonical" href="https://ungdungtinhocsgk.github.io/404.html"><meta name="robots" content="noindex"><script>
      try {
        if (localStorage.getItem('tin-hoc-web:appearance') === 'classic') {
          document.documentElement.dataset.appearance = 'classic';
        }
      } catch {
        // The switch remains usable when storage is unavailable.
      }
    </script><style>:root{--background:#f5f7fb;--surface:#fff;--text:#172b4d;--primary:#2457c5;--success:#18794e;--error:#b42318}*{box-sizing:border-box}body{color:var(--text);background:var(--background);margin:0;font:18px/1.55 system-ui,sans-serif}header,main,footer{max-width:70rem;margin-inline:auto;padding:1rem}header,nav{flex-wrap:wrap;align-items:center;gap:.75rem 1.5rem;display:flex}header{justify-content:space-between}header>a{font-weight:750}a{color:var(--primary);text-underline-offset:.2em}:focus-visible{outline-offset:4px;outline:3px solid #a43e00}h1,h2,h3{line-height:1.2}h1{font-size:clamp(2rem,5vw,3.5rem)}button,input,select,textarea{font:inherit}button{min-height:44px}svg,canvas,img{max-width:100%}@media (prefers-reduced-motion:reduce){*,:before,:after{transition-duration:.01ms!important;animation-duration:.01ms!important}}main>nav:first-child{font-size:.92rem}main>h1{margin-block:.55em .3em}fieldset label{line-height:1.7}fieldset select,.tool-toolbar select{max-width:100%;min-height:2rem}@media print{header,button,form,input,select,details{display:none!important}body{background:#fff}main{padding:0}}.appearance-switch:not([hidden]){flex-wrap:wrap;gap:.35rem;display:inline-flex}.appearance-switch button{background:var(--surface);color:var(--text);cursor:pointer;border:1px solid #8198bc;border-radius:.35rem;padding:.3rem .65rem;font-size:1rem}.appearance-switch button[aria-pressed=true]{background:var(--primary);border-color:var(--primary);color:#fff}:root[data-appearance=classic]{--background:#dbe5e0;--surface:#f8f4e6;--text:#183831;--primary:#215c50}:root[data-appearance=classic] body{background-image:repeating-linear-gradient(135deg,#2454460a 0 1px,#0000 1px 8px);font-family:Tahoma,Segoe UI,system-ui,sans-serif}:root[data-appearance=classic] header{color:#fff5d6;background:#183f37;border-bottom:5px solid #ad8546}:root[data-appearance=classic] header a{color:#fff5d6}:root[data-appearance=classic] main{background:#f5edda;border-inline:1px solid #91a99f;min-height:calc(100vh - 85px)}:root[data-appearance=classic] h1{color:#fff9e9;background:#215c50;border-block-end:4px solid #ad8546;padding:.55rem .85rem;font-size:clamp(1.65rem,4vw,2.45rem)}:root[data-appearance=classic] :is(.catalog li,.tool-shell){border:1px solid #69877c;border-radius:0;box-shadow:inset 2px 2px #fffdf3,3px 3px #69877c44}:root[data-appearance=classic] :is(button,select,textarea){border-radius:0}:root[data-appearance=classic] :is(.tool-shell button:not(.blocks-card),.appearance-switch button){color:#183831;background:#eee3c9;border:1px solid #688277;box-shadow:inset 1px 1px #fff,inset -1px -1px #9a977f}:root[data-appearance=classic] .appearance-switch button[aria-pressed=true]{color:#17372e;background:#d3e8d5;box-shadow:inset 2px 2px #69877c}:root[data-appearance=classic] .tool-shell :is(fieldset,dialog){border-color:#839b8c;border-radius:0}:root[data-appearance=classic] .tool-shell .blocks-card:not(.blocks-card-open){color:#183831;background:#d4e5d8;border:2px outset #aac9b4}
</style></head><body><header><a href="/">Công cụ Tin học</a><nav aria-label="Điều hướng chính"><a href="/huong-dan/">Hướng dẫn</a><a href="/tien-do/">Tiến độ</a><a href="/ve-du-an/">Về dự án</a></nav><div class="appearance-switch" role="group" aria-label="Chọn giao diện" hidden><button type="button" data-appearance-option="classic" aria-pressed="false">Giao diện cũ</button><button type="button" data-appearance-option="modern" aria-pressed="true">Giao diện mới</button></div></header><main><h1>Không tìm thấy trang</h1><p>Hãy quay về trang chủ để chọn một công cụ.</p><a href="/">Về trang chủ</a></main><script>
      (() => {
        const root = document.documentElement;
        const group = document.querySelector('.appearance-switch');
        const buttons = group.querySelectorAll('button');
        function apply(appearance) {
          if (appearance === 'classic') root.dataset.appearance = 'classic';
          else delete root.dataset.appearance;
          for (const button of buttons) {
            button.setAttribute('aria-pressed', String(button.dataset.appearanceOption === appearance));
          }
        }
        apply(root.dataset.appearance ?? 'modern');
        group.addEventListener('click', event => {
          const appearance = event.target.closest('button')?.dataset.appearanceOption;
          if (!appearance) return;
          apply(appearance);
          try {
            localStorage.setItem('tin-hoc-web:appearance', appearance);
          } catch {
            // Keep the selection on this page.
          }
        });
        group.hidden = false;
      })();
    </script></body></html>
