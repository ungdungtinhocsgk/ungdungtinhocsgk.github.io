<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><title>Không tìm thấy trang</title><meta name="description" content="Đường dẫn này chưa có nội dung."><link rel="canonical" href="https://ungdungtinhocsgk.github.io/404.html"><meta name="robots" content="noindex"><script>
      try {
        if (localStorage.getItem('tin-hoc-web:appearance') === 'classic') {
          document.documentElement.dataset.appearance = 'classic';
        }
      } catch {
        // The switch remains usable when storage is unavailable.
      }
    </script><link rel="stylesheet" href="/_astro/BaseLayout.CWkH8VG-.css"></head><body><header><a href="/">Công cụ Tin học</a><nav aria-label="Điều hướng chính"><a href="/huong-dan/">Hướng dẫn</a><a href="/tien-do/">Tiến độ</a><a href="/ve-du-an/">Về dự án</a></nav><div class="appearance-switch" role="group" aria-label="Chọn giao diện" hidden><button type="button" data-appearance-option="classic" aria-pressed="false">Giao diện cũ</button><button type="button" data-appearance-option="modern" aria-pressed="true">Giao diện mới</button></div></header><main><h1>Không tìm thấy trang</h1><p>Hãy quay về trang chủ để chọn một công cụ.</p><a href="/">Về trang chủ</a></main><script>
      (() => {
        const root = document.documentElement;
        const group = document.querySelector('.appearance-switch');
        const buttons = group.querySelectorAll('button');
        function apply(appearance) {
          if (appearance === 'classic') root.dataset.appearance = 'classic';
          else delete root.dataset.appearance;
          for (const button of buttons) {
            button.setAttribute('aria-pressed', String(button.dataset.appearanceOption === appearance));
          }
        }
        apply(root.dataset.appearance ?? 'modern');
        group.addEventListener('click', event => {
          const appearance = event.target.closest('button')?.dataset.appearanceOption;
          if (!appearance) return;
          apply(appearance);
          try {
            localStorage.setItem('tin-hoc-web:appearance', appearance);
          } catch {
            // Keep the selection on this page.
          }
        });
        group.hidden = false;
      })();
    </script></body></html>
